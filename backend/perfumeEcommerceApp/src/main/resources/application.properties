spring.application.name=perfumeEcommerceApp


spring.datasource.url=${DB_NAME}
spring.datasource.username=blezant
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.show-sql=true
server.port=8080
spring.jpa.hibernate.ddl-auto=update
api.secret.key=${API_KEY}

#Resend properties

resend_mail=${RESEND_MAIL}
resend.api.key=${RESEND_API_KEY}


cloud.aws.access-key=${CLOUD_AWS_ACCESS_KEY}
cloud.aws.secret-key=${CLOUD_AWS_SECRET_KEY}
cloud.aws.region=${CLOUD_AWS_REGION}
cloud.aws.bucket-name=${CLOUD_AWS_BUCKET_NAME}

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.rabbitmq.addresses=${SPRING_RABBIT_ADDRESSES}



